<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ece4"/>
      <stop offset="1" stop-color="#e3dccf"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b89a"/>
      <stop offset="1" stop-color="#a89271"/>
    </linearGradient>
    <linearGradient id="bedFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4632"/>
      <stop offset="1" stop-color="#3e2f20"/>
    </linearGradient>
    <linearGradient id="duvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e4dc"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3ec"/>
      <stop offset="1" stop-color="#9fc2d1"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff5d6"/>
      <stop offset="1" stop-color="#e8c97a"/>
    </radialGradient>
  </defs>

  <!-- Back wall -->
  <rect x="0" y="0" width="1200" height="560" fill="url(#wall)"/>
  <!-- Floor -->
  <polygon points="0,560 1200,560 1200,800 0,800" fill="url(#floor)"/>
  <!-- Floor grain -->
  <g stroke="#8a7457" stroke-width="1" opacity="0.35">
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="680" x2="1200" y2="680"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="0" y1="760" x2="1200" y2="760"/>
  </g>

  <!-- Window -->
  <rect x="820" y="90" width="280" height="320" fill="url(#window)" stroke="#d8d2c4" stroke-width="6"/>
  <line x1="960" y1="90" x2="960" y2="410" stroke="#d8d2c4" stroke-width="6"/>
  <line x1="820" y1="250" x2="1100" y2="250" stroke="#d8d2c4" stroke-width="6"/>
  <!-- Distant landscape -->
  <polygon points="820,330 880,290 940,320 1000,280 1060,310 1100,295 1100,410 820,410" fill="#a8b8a4" opacity="0.55"/>

  <!-- Wall art -->
  <rect x="180" y="140" width="180" height="240" fill="#fff" stroke="#cfc6b4" stroke-width="4"/>
  <circle cx="270" cy="240" r="48" fill="#d9a07a"/>
  <rect x="200" y="300" width="140" height="60" fill="#e9dccb"/>

  <rect x="400" y="180" width="140" height="180" fill="#fff" stroke="#cfc6b4" stroke-width="4"/>
  <path d="M420 320 Q470 240 520 320 Z" fill="#7d8b78"/>

  <!-- Bed frame -->
  <rect x="300" y="430" width="640" height="180" fill="url(#bedFrame)"/>
  <rect x="290" y="610" width="660" height="20" fill="#2c2014"/>
  <!-- Headboard -->
  <rect x="300" y="300" width="640" height="160" fill="#6a543c"/>
  <rect x="312" y="312" width="616" height="136" fill="none" stroke="#4a3724" stroke-width="2"/>

  <!-- Mattress -->
  <rect x="320" y="420" width="600" height="50" fill="#f6f1e7"/>

  <!-- Duvet -->
  <path d="M320 470 L920 470 L940 600 L300 600 Z" fill="url(#duvet)"/>
  <!-- Duvet folds -->
  <path d="M500 470 L490 600" stroke="#d6cfc2" stroke-width="2" fill="none"/>
  <path d="M740 470 L760 600" stroke="#d6cfc2" stroke-width="2" fill="none"/>

  <!-- Pillows -->
  <rect x="360" y="380" width="220" height="80" rx="14" fill="#ffffff" stroke="#d8d0bf" stroke-width="2"/>
  <rect x="640" y="380" width="220" height="80" rx="14" fill="#ffffff" stroke="#d8d0bf" stroke-width="2"/>
  <rect x="500" y="410" width="220" height="60" rx="12" fill="#cdb89a" stroke="#a89071" stroke-width="2"/>

  <!-- Throw blanket -->
  <path d="M340 560 L900 560 L920 600 L320 600 Z" fill="#9aa78f" opacity="0.85"/>

  <!-- Nightstand left -->
  <rect x="160" y="500" width="120" height="160" fill="#5a4632"/>
  <rect x="170" y="540" width="100" height="4" fill="#3e2f20"/>
  <circle cx="220" cy="580" r="4" fill="#caa766"/>

  <!-- Lamp -->
  <rect x="210" y="450" width="20" height="50" fill="#3e2f20"/>
  <ellipse cx="220" cy="445" rx="38" ry="22" fill="url(#lamp)"/>
  <ellipse cx="220" cy="448" rx="38" ry="6" fill="#caa766" opacity="0.6"/>

  <!-- Nightstand right -->
  <rect x="960" y="520" width="120" height="140" fill="#5a4632"/>
  <rect x="970" y="560" width="100" height="4" fill="#3e2f20"/>
  <circle cx="1020" cy="600" r="4" fill="#caa766"/>

  <!-- Plant on right nightstand -->
  <rect x="1000" y="470" width="40" height="50" fill="#b08a5e"/>
  <path d="M1020 470 Q1000 430 985 405" stroke="#5e7a52" stroke-width="4" fill="none"/>
  <path d="M1020 470 Q1040 430 1055 410" stroke="#5e7a52" stroke-width="4" fill="none"/>
  <path d="M1020 470 Q1020 425 1020 395" stroke="#5e7a52" stroke-width="4" fill="none"/>
  <ellipse cx="985" cy="405" rx="10" ry="16" fill="#7a9a6f"/>
  <ellipse cx="1055" cy="410" rx="10" ry="16" fill="#7a9a6f"/>
  <ellipse cx="1020" cy="395" rx="10" ry="16" fill="#7a9a6f"/>

  <!-- Rug -->
  <ellipse cx="620" cy="700" rx="380" ry="50" fill="#d8c9ad" opacity="0.85"/>
  <ellipse cx="620" cy="700" rx="340" ry="40" fill="none" stroke="#bda886" stroke-width="2"/>

  <!-- Soft baseboard shadow -->
  <rect x="0" y="555" width="1200" height="6" fill="#000" opacity="0.08"/>
</svg>
